name: Governance / validate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Governance metadata, paths, schemas, policies, agents and secrets
        run: node scripts/github/validate-governance.mjs
      - name: Validate every task packet
        run: npm run task:validate -- --all
      - name: Run repository fast verification
        run: npm run verify:fast
      - name: Run Declarative Validator Registry
        run: node scripts/verify/run-validator-registry.mjs
      - name: Run Validator Registry Migration Parity Check
        run: node tests/governance/validate-validator-registry-migration.mjs

  reconciliation:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: reconciliation-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile verified task to done post-merge
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
        run: node scripts/task/reconcile-merged-task.mjs
