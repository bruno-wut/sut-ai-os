name: Governance / validate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Governance metadata, paths, schemas, policies, agents and secrets
        run: node scripts/github/validate-governance.mjs
      - name: Validate every task packet
        run: npm run task:validate -- --all
      - name: Run repository fast verification
        run: npm run verify:fast
      - name: Run P2-002 intelligence provider contracts validator
        run: node tests/ai-analysis/validate-intelligence-provider-contracts-v1.mjs
      - name: Run P1-004 V1 policy contract validator
        run: node tests/policy-definitions/validate-authorization-policies-v1.mjs
      - name: Run P1-005 V2 policy contract validator
        run: node tests/policy-definitions/validate-authorization-policies-v2.mjs
      - name: Run P1-005 policy evaluator validator
        run: node tests/policy-engine/validate-deterministic-policy-evaluator.mjs
      - name: Run P1-006 playbook registry validator
        run: node tests/playbooks/validate-playbook-registry-v1.mjs
      - name: Run P1-007 kill-switch controls validator
        run: node tests/orchestrator/validate-kill-switch-controls-v1.mjs
      - name: Run P1-008 observe-only Staff OS control views validator
        run: node tests/staff-os/validate-observe-only-control-views-v1.mjs



